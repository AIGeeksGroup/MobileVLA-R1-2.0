[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilevla-r1"
version = "2.0.0"
description = "Reasoning-conditioned mobile robot actions with SFT and offline GRPO"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.10.0,<2.11", "torchvision>=0.25.0,<0.26", "transformers==4.44.2", "peft==0.12.0", "accelerate==0.34.2", "numpy>=1.24,<2", "Pillow>=10", "PyYAML>=6", "safetensors>=0.4.3", "sentencepiece>=0.2", "protobuf>=4"]

[project.scripts]
mobilevla-train = "mobilevla_r1.training.train:main"
mobilevla-infer = "mobilevla_r1.inference:main"
mobilevla-validate = "mobilevla_r1.data:main"
mobilevla-evaluate = "mobilevla_r1.evaluation:main"

[tool.setuptools.packages.find]
include = ["mobilevla_r1*"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.11", "pip-audit>=2.9"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
